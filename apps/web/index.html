<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- SEO & Branding -->
    <title>TuttoMinutto — Здесь выбираешь ты!</title>
    <meta name="description" content="TuttoMinutto — обратный аукцион услуг в курортных хабах Пхукет, Бали, Бангкок и Вьетнам. Создай заявку и получи лучие офферы за 1 минуту." />
    <meta property="og:title" content="TuttoMinutto — Здесь выбираешь ты!" />
    <meta property="og:description" content="Обратный аукцион услуг за 1 минуту. Исполнители конкурируют за твой заказ." />
    <meta property="og:type" content="website" />
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        try {
          if (window.Telegram && window.Telegram.WebApp) {
            var tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            if (typeof tg.disableVerticalSwipes === 'function') {
              tg.disableVerticalSwipes();
            }
            if (typeof tg.requestFullscreen === 'function') {
              tg.requestFullscreen();
            }
            if (typeof tg.setHeaderColor === 'function') {
              tg.setHeaderColor('#0B0F19');
              tg.setBackgroundColor('#0B0F19');
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0D1117] text-white overscroll-y-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
